<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>YAYA Sunday School Tracker – RCCG LifeGate Parish</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef2f9;--card:#fff;--tx:#0f1b3d;--mu:#5b6685;--bd:#dbe2f0;--navy:#0b1f4d;--blue:#1e40af;--gold:#c9a24b;--red:#c62839;--green:#12894a;--hi:#fff7de;--row:#f5f8fe;--sh:0 1px 2px rgba(11,31,77,.06),0 8px 24px rgba(11,31,77,.07)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1226;--card:#101b3a;--tx:#e8edfb;--mu:#9fabcf;--bd:#26345f;--navy:#1b2b5e;--blue:#7fa0ff;--hi:#3d3516;--row:#14224a;--sh:none}}
:root[data-theme=dark]{--bg:#0a1226;--card:#101b3a;--tx:#e8edfb;--mu:#9fabcf;--bd:#26345f;--navy:#1b2b5e;--blue:#7fa0ff;--hi:#3d3516;--row:#14224a;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.5 Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{background:linear-gradient(135deg,#061233,#0b1f4d 55%,#17358c);color:#fff;border-bottom:3px solid var(--gold)}
.hd{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:14px 16px}
header img{height:62px;width:auto;border-radius:12px;background:#fff;padding:3px}
h1{font-size:21px;margin:0;font-weight:700;letter-spacing:.2px}header p{margin:2px 0 0;color:#b9c6f0;font-size:13px}.sp{flex:1}
nav{display:flex;gap:6px;padding:14px max(12px,calc((100% - 1100px)/2 + 12px));overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{border:1px solid transparent;background:none;color:var(--mu);font:600 13.5px inherit;font-family:inherit;padding:9px 16px;border-radius:99px;cursor:pointer;white-space:nowrap}
nav button:hover{background:var(--card)}nav button.on{background:var(--navy);color:#fff;box-shadow:var(--sh)}
main{max-width:1100px;margin:0 auto;padding:0 12px 40px}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:9px 11px;min-width:0}input:focus,select:focus{outline:2px solid var(--blue);outline-offset:-1px}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:10px 0 4px}dialog label+input,dialog label+select,dialog label+div{width:100%}
button.b{font:600 13.5px inherit;font-family:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 15px;border-radius:9px;cursor:pointer}button.b:hover{border-color:var(--blue)}
button.p{background:#1e3a8a;color:#fff;border-color:#1e3a8a}button.g{background:var(--green);color:#fff;border-color:var(--green)}button.r{color:var(--red)}button.s{padding:4px 10px;font-size:12.5px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--navy);color:#fff;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}tr:nth-child(even) td{background:var(--row)}td.w{white-space:normal;min-width:160px}tr.bd td{background:var(--hi)}tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:700;color:#fff}.Love{background:var(--red)}.Joy{background:#b7791f}.Peace{background:var(--green)}
.role{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid}.role.admin{background:#fff3cf;color:#7a5a00;border-color:var(--gold)}.role.recorder{background:#dbe8ff;color:#1e3a8a;border-color:#9db7f5}.role.viewer{background:#e9ecf3;color:#47506b;border-color:#c8cfe0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.stat{border:1px solid var(--bd);border-radius:12px;padding:12px 14px;background:var(--card);border-top:3px solid var(--blue)}.stat b{font-size:25px;display:block;color:var(--blue);line-height:1.2}.stat span{font-size:12px;color:var(--mu)}
.ex .stat b{font-size:16px;color:var(--tx)}.btns{display:flex;gap:6px;margin-top:10px}
.hero{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#0b1f4d,#17358c);color:#fff;border-radius:14px;padding:18px 20px;margin-bottom:16px}.hero h3{margin:0 0 4px}.hero p{margin:0;color:#c3cff3}
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}.att label{display:flex;align-items:center;gap:10px;margin:0;padding:11px 12px;border:1px solid var(--bd);border-radius:11px;font-size:14.5px;font-weight:500;color:var(--tx);cursor:pointer}
.att label.on{background:rgba(18,137,74,.13);border-color:var(--green)}.att input{width:22px;height:22px;accent-color:var(--green)}.att small{color:var(--mu);display:block}
h3{color:var(--blue);margin:20px 0 10px;font-size:16px}.mu{color:var(--mu)}.note{font-size:13px;padding:9px 13px;border-radius:9px;background:var(--hi);margin:0 0 14px}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);width:min(440px,94vw);padding:20px}dialog::backdrop{background:rgba(5,12,35,.6)}
.g2{display:flex;gap:8px}.g2>*{flex:1}.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}footer{text-align:center;color:var(--mu);font-size:12px;padding:0 12px 24px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0b1f4d;color:#fff;padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw}#toast.on{opacity:1}
@media print{nav,.bar button,header p,.noprint,footer{display:none!important}body{background:#fff;color:#000}}
</style></head><body>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,collection,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {FIREBASE_CONFIG,ADMIN_EMAIL,DATABASE_ID} from "./firebase-config.js";
const CL=['Love','Joy','Peace'],MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],TABS=[['members','Members'],['att','Attendance'],['rep','Reports'],['exp','Export'],['acc','Access & Roles']];
let M={},A={},db=null,dl=null,role=null,user=null,ready=false,R={},tab='members',q='',fc='',fb='',editId=null,aDate=lastSunday(),aCls='Love',aSel=null,rCls='';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lastSunday(){const d=new Date();d.setDate(d.getDate()-d.getDay());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

const S=c=>c==='members'?M:c==='roles'?R:A,msg=e=>(e&&e.code==='permission-denied')?'You do not have permission for that':((e&&(e.message||e.code))||'error');
async function put(col,id,obj){S(col)[id]=obj;try{await setDoc(doc(fdb,col,id),obj)}catch(e){toast('Save failed: '+msg(e));return false}return true}

const RL={admin:'Administrator',recorder:'Recorder',viewer:'Viewer'},canW=()=>role!=='viewer',isAdm=()=>role==='admin';
function chip(){const w=$('#who');if(!w)return;w.innerHTML=user&&role?`<span class="role ${role}">${RL[role]}</span><span style="font-size:12px;color:#b9c6f0;margin:0 8px">${esc(user.email)}</span><button class="b s" data-a="out">Sign out</button>`:''}
function gate(){if(!CFG_OK)return box('Setup needed','Firebase is not connected yet. Open <b>firebase-config.js</b> and paste your Firebase details (see the setup guide).');if(!ready)return '<p class="mu">Loading…</p>';if(!user)return box('Welcome','Sign in with your Google account to open the YAYA Sunday School register.','<button class="b p" data-a="login" style="padding:12px 22px;font-size:15px">Sign in with Google</button>');if(!role)return box('Access pending','You are signed in as <b>'+esc(user.email)+'</b>, but have not been given access yet. Please ask the administrator to add this email under Access &amp; Roles.','<button class="b" data-a="out">Sign out</button>');return ''}
const box=(h,p,b='')=>`<div style="text-align:center;padding:40px 12px;max-width:520px;margin:auto"><h2 style="color:var(--blue);margin:0 0 8px">${h}</h2><p class="mu">${p}</p>${b}</div>`;
function render(){const g=gate();$('#nav').style.display=g?'none':'';nav();chip();$('#view').innerHTML=g||({members:vMembers,att:vAtt,rep:vRep,exp:vExp,acc:vAcc})[tab]()}
function banner(){return ''}
function vMembers(){const mo=new Date().getMonth()+1,L=mem().filter(m=>(!fc||m.cls===fc)&&(!fb||+m.month===+fb)&&(!q||(m.name+m.phone+m.address).toLowerCase().includes(q.toLowerCase())));
const all=mem(),bm=all.filter(m=>+m.month===mo).length;
return banner()+`<div class="stats"><div class="stat"><b>${all.length}</b><span>Total members</span></div>${CL.map(c=>`<div class="stat"><b>${all.filter(m=>m.cls===c).length}</b><span>${c} Class</span></div>`).join('')}<div class="stat"><b>${bm}</b><span>Birthdays in ${MO[mo-1]}</span></div></div>
${upc()}<div class="bar"><input id="q" placeholder="Search name, phone, address…" value="${esc(q)}" style="flex:1;min-width:180px"><select id="fcl"><option value="">All classes</option>${CL.map(c=>`<option ${c===fc?'selected':''}>${c}</option>`).join('')}</select><select id="fbm"><option value="">All birth months</option>${MO.map((m,i)=>`<option value="${i+1}" ${+fb===i+1?'selected':''}>${m}</option>`).join('')}</select>${canW()?'<button class="b p" data-a="add">+ Add member</button>':''}<button class="b" data-x="mxlsx">Export Excel</button></div>
<div class="tw"><table><tr><th>#</th><th>Name</th><th>Class</th><th>Phone</th><th>Address</th><th>Birthday</th><th></th></tr>${L.map((m,i)=>`<tr class="${+m.month===mo?'bd':''}"><td class="mu">${i+1}</td><td><b>${esc(m.name)}</b></td><td><span class="tag ${m.cls}">${m.cls}</span></td><td>${esc(m.phone)}</td><td class="w">${esc(m.address)}</td><td>${bday(m)}</td><td>${canW()?`<button class="b s" data-a="edit" data-id="${m.id}">Edit</button>`:''} ${isAdm()?`<button class="b s r" data-a="del" data-id="${m.id}">Delete</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="mu">No members yet — click “Add member”.</td></tr>'}</table></div><p class="mu" style="font-size:12px">Highlighted rows = birthday this month.</p>`}
function upc(){const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());const L=mem().filter(m=>m.day&&m.month).map(m=>{let d=new Date(n.getFullYear(),m.month-1,m.day);if(d<t0)d=new Date(n.getFullYear()+1,m.month-1,m.day);return{m,k:Math.round((d-t0)/864e5)}}).filter(x=>x.k<=7).sort((a,b)=>a.k-b.k);
return L.length?`<div class="note"><b>Upcoming birthdays (next 7 days):</b> ${L.map(x=>`${x.k===0?'Today':x.k===1?'Tomorrow':x.m.day+' '+MO[x.m.month-1]} – ${esc(x.m.name)} (${x.m.cls})`).join(' · ')}</div>`:''}
function key(){return aDate+'_'+aCls}
function vAtt(){const L=mem().filter(m=>m.cls===aCls),rec=A[key()];if(!aSel||aSel.k!==key())aSel={k:key(),s:new Set(rec?rec.present:[])};
const n=L.filter(m=>aSel.s.has(m.id)).length;
return banner()+`<div class="bar"><input type="date" id="ad" value="${aDate}"><select id="ac">${CL.map(c=>`<option ${c===aCls?'selected':''}>${c}</option>`).join('')}</select><span class="sp"></span>${canW()?'<button class="b" data-a="addc">+ New member</button>':''}</div>
<div class="stats"><div class="stat"><b>${n} / ${L.length}</b><span>Present · ${aCls} · ${new Date(aDate+'T00:00').toDateString()}</span></div><div class="stat"><b>${L.length?Math.round(n/L.length*100):0}%</b><span>Attendance rate</span></div><div class="stat"><span>${rec?'✔ Saved earlier — edits will update it':'Not yet saved for this date'}</span></div></div>
${canW()?'<div class="bar"><button class="b" data-a="all">Mark all present</button><button class="b" data-a="none">Clear</button><span class="sp"></span><button class="b g" data-a="saveatt">Save attendance</button></div>':'<p class="note">You have view-only access. Ask the administrator for Recorder access to take attendance.</p>'}
<div class="att">${L.map(m=>`<label class="${aSel.s.has(m.id)?'on':''}"><input type="checkbox" data-m="${m.id}" ${aSel.s.has(m.id)?'checked':''} ${canW()?'':'disabled'}><span>${esc(m.name)}<small>${esc(m.phone)}</small></span></label>`).join('')||'<p class="mu">No members in this class yet. Add them in the Members tab.</p>'}</div>`}
function stats(c){const recs=Object.values(A).filter(r=>!c||r.cls===c);return mem().filter(m=>!c||m.cls===c).map(m=>{const held=Object.values(A).filter(r=>r.cls===m.cls),p=held.filter(r=>r.present.includes(m.id)).sort((a,b)=>b.date.localeCompare(a.date));return{m,held:held.length,p:p.length,pc:held.length?Math.round(p.length/held.length*100):0,last:p[0]?p[0].date:'—'}})}
function vRep(){const S=stats(rCls),recs=Object.values(A).filter(r=>!rCls||r.cls===rCls).sort((a,b)=>b.date.localeCompare(a.date));
return `<div class="bar"><select id="rc"><option value="">All classes</option>${CL.map(c=>`<option ${c===rCls?'selected':''}>${c}</option>`).join('')}</select><span class="sp"></span><button class="b" data-x="axlsx">Export Excel</button><button class="b" data-x="prt">Print / PDF</button></div>
<div class="stats">${CL.map(c=>{const r=Object.values(A).filter(x=>x.cls===c);const avg=r.length?(r.reduce((s,x)=>s+x.present.length,0)/r.length).toFixed(1):'0';return `<div class="stat"><b>${avg}</b><span>${c} · avg attendance (${r.length} Sundays)</span></div>`}).join('')}</div>
<h3>Member attendance</h3><div class="tw"><table><tr><th>Name</th><th>Class</th><th>Present</th><th>Sundays held</th><th>Rate</th><th>Last attended</th></tr>${S.map(s=>`<tr><td><b>${esc(s.m.name)}</b></td><td><span class="tag ${s.m.cls}">${s.m.cls}</span></td><td>${s.p}</td><td>${s.held}</td><td>${s.pc}%</td><td>${s.last}</td></tr>`).join('')||'<tr><td colspan="6" class="mu">No data yet.</td></tr>'}</table></div>
<h3>Sunday log</h3><div class="tw"><table><tr><th>Date</th><th>Class</th><th>Present</th><th>Absent</th><th></th></tr>${recs.map(r=>{const tot=mem().filter(m=>m.cls===r.cls).length;return `<tr><td>${r.date}</td><td><span class="tag ${r.cls}">${r.cls}</span></td><td>${r.present.length}</td><td>${Math.max(0,tot-r.present.length)}</td><td><button class="b s" data-a="open" data-d="${r.date}" data-c="${r.cls}">Open</button></td></tr>`}).join('')||'<tr><td colspan="5" class="mu">No attendance saved yet.</td></tr>'}</table></div>`}
function vExp(){return `<div class="hero"><div><h3>Complete Excel workbook</h3><p>Members, birthdays, a register sheet for each class (Love, Joy, Peace) and the Sunday log — in one .xlsx file.</p></div><button class="b" data-x="xall" style="background:#c9a24b;border-color:#c9a24b;color:#0b1f4d">Download Excel (.xlsx)</button></div>
<div class="ex">
<div class="stat"><b>Member database</b><span>Name, class, phone, address, birthday</span><div class="btns"><button class="b" data-x="mxlsx">Excel</button><button class="b" data-x="mcsv">CSV</button></div></div>
<div class="stat"><b>Attendance register</b><span>Members × Sundays (P = present). CSV uses the class chosen in Reports (${rCls||'Love'}).</span><div class="btns"><button class="b" data-x="axlsx">Excel</button><button class="b" data-x="acsv">CSV</button></div></div>
<div class="stat"><b>Backup &amp; restore</b><span>Complete data file (JSON)</span><div class="btns"><button class="b" data-x="json">Backup</button>${isAdm()?'<button class="b" data-x="imp">Restore</button><input type="file" id="fi" accept=".json" hidden>':''}</div></div>
<div class="stat"><b>Print / PDF</b><span>Open the report, then choose Save as PDF</span><div class="btns"><button class="b" data-x="prt">Print report</button></div></div></div>`}
function vAcc(){const mgr=isAdm()?`<h3>Team access</h3><div class="bar"><input id="re" type="email" placeholder="Gmail address of the person" style="flex:1;min-width:220px"><select id="rr"><option value="recorder">Recorder</option><option value="viewer">Viewer</option><option value="admin">Administrator</option></select><button class="b p" data-a="grant">Grant access</button></div>
<div class="tw"><table><tr><th>Email</th><th>Role</th><th></th></tr><tr><td>${esc(ADMIN_EMAIL)}</td><td><span class="role admin">Administrator</span></td><td class="mu">Owner</td></tr>${Object.entries(R).sort().map(([e,r])=>`<tr><td>${esc(e)}</td><td><select data-re="${esc(e)}">${['admin','recorder','viewer'].map(k=>`<option value="${k}" ${r.role===k?'selected':''}>${RL[k]}</option>`).join('')}</select></td><td><button class="b s r" data-a="revoke" data-e="${esc(e)}">Remove</button></td></tr>`).join('')}</table></div>`:'';
return `<div class="hero"><div><h3>${esc(user.displayName||user.email)} <span class="role ${role}">${RL[role]}</span></h3><p>${esc(user.email)}</p></div></div>
<div class="tw"><table><tr><th>Role</th><th>What they can do</th></tr>
<tr><td><span class="role admin">Administrator</span></td><td class="w">Everything: members, attendance, delete, restore backups, grant access</td></tr>
<tr><td><span class="role recorder">Recorder</span></td><td class="w">Take attendance, add or edit members, export</td></tr>
<tr><td><span class="role viewer">Viewer</span></td><td class="w">Read-only: view members and reports, export</td></tr></table></div>${mgr}
<p class="mu">Everyone signs in with a Google account. Changes sync live to every signed-in screen, and access rules are enforced by the database.</p>`}
function rows(){return [['Name','Class','Phone','Address','Birthday (Day)','Birthday (Month)'],...mem().map(m=>[m.name,m.cls,m.phone||'',m.address||'',m.day||'',m.month?MO[m.month-1]:''])]}
function matrix(c){const ds=Object.values(A).filter(r=>r.cls===c).sort((a,b)=>a.date.localeCompare(b.date)),L=mem().filter(m=>m.cls===c);return [['Name','Phone',...ds.map(d=>d.date),'Total Present'],...L.map(m=>{const f=ds.map(d=>d.present.includes(m.id)?'P':'-');return [m.name,m.phone||'',...f,f.filter(x=>x==='P').length]})]}
const csv=r=>'\ufeff'+r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
function save(name,data){const ty=name.endsWith('.xlsx')?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':name.endsWith('.json')?'application/json':'text/csv;charset=utf-8';const u=URL.createObjectURL(new Blob([data],{type:ty})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function xl(wb){return new Uint8Array(XLSX.write(wb,{bookType:'xlsx',type:'array'}))}
function sheet(a){const s=XLSX.utils.aoa_to_sheet(a);s['!cols']=a[0].map((_,i)=>({wch:Math.min(40,Math.max(8,...a.map(r=>String(r[i]??'').length))+2)}));return s}
function bdays(){return [['Month','Day','Name','Class','Phone'],...mem().filter(m=>m.month).sort((a,b)=>a.month-b.month||a.day-b.day).map(m=>[MO[m.month-1],m.day,m.name,m.cls,m.phone||''])]}
function logRows(){return [['Date','Class','Present','Absent'],...Object.values(A).sort((a,b)=>b.date.localeCompare(a.date)).map(r=>[r.date,r.cls,r.present.length,Math.max(0,mem().filter(m=>m.cls===r.cls).length-r.present.length)])]}
function exportX(x){const t=new Date().toISOString().slice(0,10),P='RCCG-LifeGate-YAYA-';
if(x==='mcsv')save(P+'Members-'+t+'.csv',csv(rows()));
else if(x==='acsv')save(P+'Attendance-'+(rCls||'Love')+'-'+t+'.csv',csv(matrix(rCls||'Love')));
else if(x==='json')save(P+'Backup-'+t+'.json',JSON.stringify({M,A},null,1));
else if(x==='imp')$('#fi').click();
else if(x==='prt'){tab='rep';render();setTimeout(()=>window.print(),200)}
else if(typeof XLSX==='undefined')toast('Excel library did not load — check your connection');
else{const wb=XLSX.utils.book_new(),ad=(n,a)=>XLSX.utils.book_append_sheet(wb,sheet(a),n);ad('Members',rows());
if(x!=='mxlsx'){ad('Birthdays',bdays());CL.forEach(c=>ad(c+' Register',matrix(c)));ad('Sunday Log',logRows())}
save(P+(x==='mxlsx'?'Members-':'Workbook-')+t+'.xlsx',xl(wb))}}
function fill(){$('#fc').innerHTML=CL.map(c=>`<option>${c}</option>`).join('');$('#fd').innerHTML='<option value="">Day</option>'+Array.from({length:31},(_,i)=>`<option>${i+1}</option>`).join('');$('#fm').innerHTML='<option value="">Month</option>'+MO.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}
function openForm(id,cls){editId=id||null;const m=id?M[id]:{};$('#dt').textContent=id?'Edit member':'Add member';$('#fn').value=m.name||'';$('#fp').value=m.phone||'';$('#fa').value=m.address||'';$('#fc').value=m.cls||cls||fc||'Love';$('#fd').value=m.day||'';$('#fm').value=m.month||'';$('#dlg').showModal();$('#fn').focus()}
$('#fx').onclick=()=>$('#dlg').close();
$('#fs').onclick=async()=>{const name=$('#fn').value.trim().replace(/\s+/g,' ');if(!name)return toast('Please enter a name');const d=+$('#fd').value||'',mo=+$('#fm').value||'';
if((d&&!mo)||(!d&&mo))return toast('Choose both day and month of birth');if(d&&d>new Date(2024,mo,0).getDate())return toast('That day does not exist in '+MO[mo-1]);
const c=$('#fc').value;if(!editId&&Object.values(M).some(m=>m.name.toLowerCase()===name.toLowerCase()&&m.cls===c)&&!confirm(name+' already exists in '+c+'. Add anyway?'))return;
const id=editId||Date.now().toString(36)+Math.random().toString(36).slice(2,6);
if(await put('members',id,{name,cls:c,phone:$('#fp').value.trim(),address:$('#fa').value.trim(),day:d,month:mo})){$('#dlg').close();toast('Saved '+name);if(tab==='att'&&!editId){aCls=c;aSel.s&&aSel.s.add(id)}render()}};
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.t){tab=t.dataset.t;return render()}
if(t.dataset.x)return exportX(t.dataset.x);
const a=t.dataset.a,id=t.dataset.id;
if(a==='add')openForm();else if(a==='addc')openForm(null,aCls);else if(a==='edit')openForm(id);
else if(a==='del'){if(confirm('Delete '+M[id].name+'? Their past attendance marks will no longer show.')){await rem('members',id);render()}}
else if(a==='all'){mem().filter(m=>m.cls===aCls).forEach(m=>aSel.s.add(m.id));render()}
else if(a==='none'){aSel.s.clear();render()}
else if(a==='saveatt'){const ids=mem().filter(m=>m.cls===aCls&&aSel.s.has(m.id)).map(m=>m.id);if(await put('attendance',key(),{date:aDate,cls:aCls,present:ids})){toast('Attendance saved — '+ids.length+' present');render()}}
else if(a==='login'){login()}else if(a==='out'){signOut(auth)}else if(a==='grant'){grant()}else if(a==='revoke'){if(confirm('Remove access for '+t.dataset.e+'?')){await rem('roles',t.dataset.e);render()}}
else if(a==='open'){aDate=t.dataset.d;aCls=t.dataset.c;aSel=null;tab='att';render()}});
document.addEventListener('change',e=>{const t=e.target;
if(t.dataset.re){put('roles',t.dataset.re,{role:t.value,by:user.email,at:Date.now()});toast('Role updated');return}
if(t.dataset.m){t.checked?aSel.s.add(t.dataset.m):aSel.s.delete(t.dataset.m);return render()}
if(t.id==='fcl'){fc=t.value;render()}else if(t.id==='fbm'){fb=t.value;render()}else if(t.id==='ad'){aDate=t.value||aDate;aSel=null;render()}else if(t.id==='ac'){aCls=t.value;aSel=null;render()}else if(t.id==='rc'){rCls=t.value;render()}
else if(t.id==='fi'&&t.files[0]){const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.M||!d.A)throw 0;if(!confirm('Restore '+Object.keys(d.M).length+' members and '+Object.keys(d.A).length+' attendance records? Matching records will be overwritten.'))return;for(const k in d.M)await put('members',k,d.M[k]);for(const k in d.A)await put('attendance',k,d.A[k]);toast('Backup restored');render()}catch(x){toast('Not a valid backup file')}};r.readAsText(t.files[0]);t.value=''}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;const p=e.target.selectionStart;render();const i=$('#q');i.focus();i.setSelectionRange(p,p)}});
let auth,fdb,du=[],ru=null,dOn=false;
const CFG_OK=!/^PASTE/.test(String(FIREBASE_CONFIG.apiKey||'PASTE'));
function stopData(){du.forEach(f=>f());du=[];dOn=false;M={};A={};R={}}
function startData(){if(dOn)return;dOn=true;const sub=(c,f)=>du.push(onSnapshot(collection(fdb,c),s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());f(o);if(!$('#dlg').open&&document.activeElement.id!=='q')render()},e=>toast('Database: '+msg(e))));
sub('members',o=>M=o);sub('attendance',o=>A=o);if(role==='admin')sub('roles',o=>R=o)}
function login(){const p=new GoogleAuthProvider();signInWithPopup(auth,p).catch(e=>{if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')signInWithRedirect(auth,p);else if(!/popup-closed|cancelled/.test(e.code))toast(msg(e))})}
async function grant(){const e=$('#re').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e))return toast('Enter a valid Gmail address');if(await put('roles',e,{role:$('#rr').value,by:user.email,at:Date.now()})){toast('Access granted to '+e);render()}}
if(CFG_OK){const app=initializeApp(FIREBASE_CONFIG);auth=getAuth(app);fdb=DATABASE_ID?getFirestore(app,DATABASE_ID):getFirestore(app);
onAuthStateChanged(auth,u=>{if(ru){ru();ru=null}stopData();user=u;role=null;ready=true;
if(u){const em=(u.email||'').toLowerCase();
if(em===ADMIN_EMAIL.toLowerCase()){role='admin';startData()}
else ru=onSnapshot(doc(fdb,'roles',em),s=>{const r=s.exists()?s.data().role:null;if(!r){role=null;stopData()}else if(r!==role){role=r;stopData();startData()}render()},()=>{role=null;stopData();render()})}
render()})}else ready=true;
fill();render();
</script></body></html>
